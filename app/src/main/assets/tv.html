<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>APPF Referee Lights</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;cursor:none}
#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4vh 3vw}
#head{text-align:center}
#short{font-size:5vh;font-weight:900;letter-spacing:1.2vh;color:#d4af37;text-shadow:0 0 2vh rgba(212,175,55,.5)}
#fed{font-size:2vh;letter-spacing:.8vh;color:#b8975a;margin-top:.6vh}
#lights{display:flex;gap:6vw;align-items:center;justify-content:center}
.slot{display:flex;flex-direction:column;align-items:center;gap:3vh}
.l{width:min(26vw,48vh);height:min(26vw,48vh);border-radius:50%;background:radial-gradient(circle at 35% 30%,#1c1c1c,#070707 70%);
 border:.6vh solid #222;box-shadow:inset 0 0 4vh #000;transition:background .15s,box-shadow .15s}
.l.white{background:radial-gradient(circle at 35% 30%,#fff,#e9e9e9 55%,#bdbdbd);border-color:#fff;box-shadow:0 0 10vh rgba(255,255,255,.75),0 0 3vh #fff}
.l.red{background:radial-gradient(circle at 35% 30%,#ff5a5a,#e00000 55%,#8a0000);border-color:#ff3030;box-shadow:0 0 10vh rgba(255,0,0,.75),0 0 3vh #f00}
.ind{width:3vh;height:3vh;border-radius:50%;border:.35vh solid #333;transition:all .15s}
.ind.on{border-color:#3a3a3a;background:#1a1a1a}
.ind.voted{background:#d4af37;border-color:#d4af37;box-shadow:0 0 2vh #d4af37}
.ind.off{border-color:#5a1a1a}
#result{height:9vh;font-size:8vh;font-weight:900;letter-spacing:1.5vh;opacity:0;transition:opacity .2s}
#result.show{opacity:1}
#result.good{color:#fff;text-shadow:0 0 3vh rgba(255,255,255,.6)}
#result.nolift{color:#ff2a2a;text-shadow:0 0 3vh rgba(255,0,0,.6)}
#bar{width:60vw;height:.5vh;background:#111;border-radius:1vh;overflow:hidden}
#fill{height:100%;width:0;background:#d4af37}
#login{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;cursor:auto;z-index:5}
#login input{width:40vh;font-size:5vh;text-align:center;letter-spacing:2vh;padding:1.5vh;border-radius:1.5vh;border:.3vh solid #333;background:#111;color:#fff;outline:none}
#login button{width:40vh;padding:2vh;border:0;border-radius:1.5vh;background:#d4af37;color:#000;font-size:3vh;font-weight:800;letter-spacing:.5vh}
#terr{height:3vh;color:#ff4d4d;font-size:2.4vh}
#plat{font-size:3vh;letter-spacing:1vh;color:#fff;margin-top:1vh}
#offline{position:fixed;top:1.5vh;right:1.5vw;width:1.6vh;height:1.6vh;border-radius:50%;background:#2ecc71}
#offline.bad{background:#e00}
</style></head><body>
<div id="wrap">
  <div id="head"><div id="short">APPF</div><div id="fed">AMATEUR POWER & PHYSIQUE FEDERATION</div><div id="plat"></div></div>
  <div id="lights">
    <div class="slot"><div class="l" id="L"></div><div class="ind" id="iL"></div></div>
    <div class="slot"><div class="l" id="C"></div><div class="ind" id="iC"></div></div>
    <div class="slot"><div class="l" id="R"></div><div class="ind" id="iR"></div></div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:2vh">
    <div id="result"></div><div id="bar"><div id="fill"></div></div>
  </div>
</div>
<div id="offline"></div>
<div id="login"><div id="short">APPF</div><input id="tpin" type="password" inputmode="numeric" maxlength="8" placeholder="••••">
<button id="tgo">ENTER</button><div id="terr"></div></div>
<script>
var map={left:'L',center:'C',right:'R'},lastRound=-1,anim=null;
function $(i){return document.getElementById(i)}
function beep(){try{var a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
 o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.value=.15;o.start();o.stop(a.currentTime+.25)}catch(e){}}
function draw(s){
  for(var k in map){var id=map[k];
    $(id).className='l'+(s.revealed&&s.votes?' '+s.votes[k]:'');
    $('i'+id).className='ind'+(s.revealed?'':(s.voted[k]?' voted':(s.online[k]?' on':' off')));}
  var r=$('result');
  if(s.revealed){r.textContent=s.result==='good'?'GOOD LIFT':'NO LIFT';r.className='show '+s.result;
    if(lastRound!==s.round){lastRound=s.round;beep();countdown(s.show)}}
  else{r.className='';r.textContent='';$('fill').style.transition='none';$('fill').style.width='0'}
}
function countdown(sec){var f=$('fill');f.style.transition='none';f.style.width='100%';
  setTimeout(function(){f.style.transition='width '+sec+'s linear';f.style.width='0'},50)}
var tok=null;
function store(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}}
function tlogin(){var p=$('tpin').value.trim();if(!p)return;
  fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:p})}).then(function(r){return r.json()}).then(function(j){
    if(!j.ok){$('terr').textContent='Wrong password';$('tpin').value='';return}
    if(j.role!=='tv'){$('terr').textContent='Use the TV password';$('tpin').value='';return}
    store('tvtok',j.token);store('tvplat',j.platform);go(j.token,j.platform)}).catch(function(){$('terr').textContent='No connection'})}
$('tgo').onclick=tlogin;$('tpin').onkeydown=function(e){if(e.key==='Enter')tlogin()};
function go(t,p){tok=t;$('login').style.display='none';$('plat').textContent='PLATFORM '+p;listen()}
function listen(){
  var es=new EventSource('/api/events?t='+tok);
  es.onmessage=function(e){$('offline').className='';draw(JSON.parse(e.data))};
  es.onerror=function(){$('offline').className='bad';es.close();
    fetch('/api/events?t='+tok).then(function(r){if(r.status===401){store('tvtok',null);location.reload()}else setTimeout(listen,1500)}).catch(function(){setTimeout(listen,1500)})};
}
document.body.ondblclick=function(){try{document.documentElement.requestFullscreen()}catch(e){}};
document.onkeydown=function(e){if(e.key==='f'||e.key==='F'){try{document.documentElement.requestFullscreen()}catch(x){}}};
var t0=store('tvtok');if(t0)go(t0,store('tvplat'));
else fetch('/api/autotv').then(function(r){return r.json()}).then(function(j){if(j.ok){store('tvtok',j.token);store('tvplat',j.platform);go(j.token,j.platform)}}).catch(function(){});
</script></body></html>
