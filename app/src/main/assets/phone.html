<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.json">
<title>APPF Referee</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.gold{color:#d4af37}
#login{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
.badge{width:110px;height:110px;border-radius:50%;border:3px solid #d4af37;display:flex;align-items:center;justify-content:center;
 font-weight:900;font-size:30px;letter-spacing:2px;color:#d4af37;box-shadow:0 0 30px rgba(212,175,55,.35) inset,0 0 20px rgba(212,175,55,.2)}
.fed{font-size:12px;letter-spacing:3px;text-align:center;color:#d4af37;max-width:300px;line-height:1.6}
#pin{width:240px;font-size:34px;text-align:center;letter-spacing:12px;padding:14px;border-radius:14px;border:2px solid #333;
 background:#111;color:#fff;outline:none;user-select:text}
#pin:focus{border-color:#d4af37}
#go{width:240px;padding:16px;border:0;border-radius:14px;background:#d4af37;color:#000;font-size:20px;font-weight:800;letter-spacing:2px}
#err{height:18px;color:#ff4d4d;font-size:14px}
#pad{display:none;height:100%;flex-direction:column}
#top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:13px;letter-spacing:2px;border-bottom:1px solid #222}
#dot{width:10px;height:10px;border-radius:50%;background:#555;display:inline-block;margin-right:8px}
#dot.on{background:#2ecc71;box-shadow:0 0 8px #2ecc71}
.btns{flex:1;display:flex;flex-direction:column;gap:14px;padding:14px}
.b{flex:1;border-radius:22px;border:4px solid transparent;font-size:44px;font-weight:900;letter-spacing:6px;display:flex;
 align-items:center;justify-content:center;transition:transform .08s}
.b:active{transform:scale(.97)}
#w{background:#f2f2f2;color:#000}
#r{background:#d10f0f;color:#fff}
.b.sel{border-color:#d4af37;box-shadow:0 0 0 4px #000 inset,0 0 30px rgba(212,175,55,.8)}
.b.dim{opacity:.25}
#msg{text-align:center;padding:10px 0 16px;font-size:15px;letter-spacing:2px;min-height:44px}
#reset{display:none;margin:0 14px 14px;padding:12px;border-radius:12px;border:1px solid #444;background:#111;color:#aaa;font-size:14px;letter-spacing:2px}
</style></head><body>
<div id="login">
  <div class="badge">APPF</div>
  <div class="fed">AMATEUR POWER & PHYSIQUE FEDERATION</div>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••">
  <button id="go">ENTER</button>
  <div id="err"></div>
</div>
<div id="pad">
  <div id="top"><span><span id="dot"></span><span id="rname"></span></span><span class="gold">APPF</span></div>
  <div class="btns">
    <div class="b" id="w">WHITE</div>
    <div class="b" id="r">RED</div>
  </div>
  <div id="msg"></div>
  <button id="reset">HOLD TO RESET LIGHTS</button>
</div>
<script>
var token=null,es=null,st={},wake=null;
function store(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}}
function $(i){return document.getElementById(i)}
function post(u,d){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){return r.json()})}
function login(){
  var p=$('pin').value.trim(); if(!p)return;
  post('/api/login',{pin:p}).then(function(j){
    if(!j.ok){$('err').textContent='Wrong password';$('pin').value='';return}
    if(j.role==='tv'){$('err').textContent='This is a TV password';$('pin').value='';return}
    var nm='PLATFORM '+j.platform+' · '+j.name;store('tok',j.token);store('name',nm);store('role',j.role);start(j.token,nm,j.role);
  }).catch(function(){$('err').textContent='No connection'});
}
$('go').onclick=login;$('pin').onkeydown=function(e){if(e.key==='Enter')login()};
function start(t,name,role){
  token=t;$('login').style.display='none';$('pad').style.display='flex';$('rname').textContent=name;
  if(role==='center')$('reset').style.display='block';
  keepAwake();listen();
}
function listen(){
  if(es)es.close();
  es=new EventSource('/api/events?t='+token);
  es.onmessage=function(e){st=JSON.parse(e.data);$('dot').className='on';draw()};
  es.onerror=function(){$('dot').className='';es.close();
    fetch('/api/events?t='+token).then(function(r){if(r.status===401)logout();else setTimeout(listen,1500)})
      .catch(function(){setTimeout(listen,1500)});};
}
function logout(){store('tok',null);token=null;if(es)es.close();$('pad').style.display='none';$('login').style.display='flex';$('pin').value=''}
function draw(){
  var m=st.mine,w=$('w'),r=$('r');
  w.className='b'+(m==='white'?' sel':(m?' dim':''));r.className='b'+(m==='red'?' sel':(m?' dim':''));
  if(st.revealed){$('msg').innerHTML='<span class="gold">'+(st.result==='good'?'GOOD LIFT':'NO LIFT')+'</span>'}
  else $('msg').textContent=m?('SENT ✓  '+m.toUpperCase()):'';
}
function vote(v){
  if(st.revealed)return;
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  st.mine=v;draw();
  post('/api/vote',{token:token,vote:v}).then(function(j){if(j.relogin)logout()}).catch(function(){$('msg').textContent='Not sent – check WiFi'});
}
$('w').onclick=function(){vote('white')};$('r').onclick=function(){vote('red')};
var ht=null;
$('reset').addEventListener('pointerdown',function(){ht=setTimeout(function(){post('/api/reset',{token:token})},900)});
['pointerup','pointerleave','pointercancel'].forEach(function(ev){$('reset').addEventListener(ev,function(){clearTimeout(ht)})});
function keepAwake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wake=l}).catch(function(){})}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&token)keepAwake()});
var qp=(location.search.match(/[?&]pin=(\d+)/)||[])[1];
if(qp){store('tok',null);$('pin').value=qp;login()}
else{var t0=store('tok');if(t0)start(t0,store('name'),store('role'))}
</script></body></html>
